<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07080b" />
    <meta name="description" content="Interactive, code-first presentations. Pick a deck to play, or start your own from a template." />
    <meta property="og:title" content="Decks: Interactive Presentation Hub" />
    <meta property="og:description" content="Interactive 3D presentations, starting with Distributed Consensus in Blockchain." />
    <meta property="og:type" content="website" />
    <title>Decks · Presentation Hub</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%2307080b%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%223.5%22 fill=%22%233ed6c5%22/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="hub.css" />
    <script type="module" src="hub.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to presentations</a>

    <header class="appbar">
      <a class="brand" href="./" aria-label="Decks home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="7" fill="#111318" stroke="#23262e" />
          <circle cx="16" cy="16" r="7" fill="none" stroke="#3ed6c5" stroke-width="2.5" />
          <circle cx="16" cy="16" r="2.5" fill="#3ed6c5" />
        </svg>
        <span class="brand-name">Decks</span>
      </a>

      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16a6.47 6.47 0 0 0 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z" /></svg>
        <span class="sr-only">Search presentations</span>
        <input id="q" type="search" placeholder="Search presentations" autocomplete="off" spellcheck="false" />
        <kbd aria-hidden="true">/</kbd>
      </label>

      <nav class="appbar-actions" aria-label="Project links">
        <a class="icon-btn" id="repo-link" href="https://github.com/Drago-03/Distributed_Consensus_in_Blockchain" target="_blank" rel="noopener" aria-label="View source on GitHub" title="View source on GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z" /></svg>
        </a>
      </nav>
    </header>

    <section class="gallery" aria-labelledby="gallery-title">
      <div class="wrap">
        <div class="row-head">
          <h2 id="gallery-title">Start a new presentation</h2>
          <button class="text-btn" id="gallery-toggle" type="button" aria-expanded="false" aria-controls="templates" hidden>
            Template gallery
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.83 15.17 9l1.41-1.41L12 3 7.41 7.59 8.83 9 12 5.83Zm0 12.34L8.83 15l-1.41 1.41L12 21l4.59-4.59L15.17 15 12 18.17Z" /></svg>
          </button>
        </div>
        <ul class="templates" id="templates" role="list"></ul>
      </div>
    </section>

    <main id="main" class="wrap" tabindex="-1">
      <div class="list-head">
        <h2 id="list-title">Presentations</h2>
        <div class="controls">
          <label class="select">
            <span class="sr-only">Filter by topic</span>
            <select id="topic"><option value="">All topics</option></select>
          </label>
          <button class="icon-btn" id="sort-toggle" type="button"></button>
          <button class="icon-btn" id="view-toggle" type="button"></button>
        </div>
      </div>

      <div class="list-cols" aria-hidden="true">
        <span>Name</span><span>Topic</span><span>Length</span><span>Last updated</span><span></span>
      </div>
      <div id="decks" class="decks" role="list" aria-labelledby="list-title"></div>
      <p id="empty" class="empty" hidden></p>
      <p id="error" class="empty" hidden>Couldn't load the presentation list. Try refreshing the page.</p>
    </main>

    <footer class="foot">
      <div class="wrap foot-inner">
        <span>Open source under the MIT License</span>
        <span class="foot-links">
          <a href="https://github.com/Drago-03/Distributed_Consensus_in_Blockchain/blob/main/CONTRIBUTING.md" target="_blank" rel="noopener">Contribute a deck</a>
          <a href="https://github.com/Drago-03/Distributed_Consensus_in_Blockchain/issues/new/choose" target="_blank" rel="noopener">Report an issue</a>
        </span>
      </div>
    </footer>

    <div id="menu" class="menu" role="menu" hidden></div>

    <dialog id="tpl" class="dialog" aria-labelledby="tpl-title">
      <form method="dialog" class="dialog-close-form">
        <button class="icon-btn dialog-close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41Z" /></svg>
        </button>
      </form>
      <div class="dialog-body"></div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
